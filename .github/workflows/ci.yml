name: IA Creativa LAB / archive integrity
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  internal-archive:
    name: Archive integrity / safe public entrypoints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static UI syntax
        run: node --check workbench/studio.js
      - name: Validate original folder boundaries and source links
        run: node --test tests/workbench.test.mjs
      - name: Confirm safe public handoff
        run: |
          test -s index.html
          test -s site/index.html
          grep -q "NO PUBLICACIÓN" index.html
          grep -q "https://www.belentani.es/ai-lab" index.html
          ! grep -q "catalog.json" index.html
      - name: No deployment by this workflow
        run: echo "Archive verification only. Public traffic is handed to the central platform."
