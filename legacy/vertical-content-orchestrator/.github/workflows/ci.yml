# generated by belentani_omega - safe to overwrite
name: CI (pnpm)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm@9 --no-audit --no-fund
      - name: neutralise a malformed pnpm workspace file
        run: |
          if [ -f pnpm-workspace.yaml ] && ! grep -qE '^packages:' pnpm-workspace.yaml; then
            echo "pnpm-workspace.yaml declares no packages; disabling it for this run."
            mv pnpm-workspace.yaml pnpm-workspace.yaml.disabled
          fi
      - run: pnpm install --no-frozen-lockfile
      - name: detect build script
        id: buildscript
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No build script declared in package.json."
          fi
      - if: steps.buildscript.outputs.present == 'true'
        run: pnpm run build
